name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-audit:
    name: Dependency Audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit client
        run: pnpm audit --audit-level=high
        working-directory: client
        continue-on-error: true # Report but don't fail on transitive deps

      - name: Audit server
        run: pnpm audit --audit-level=high
        working-directory: server
        continue-on-error: true

  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (client)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./client
          format: sarif
          output: trivy-client.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (server)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./server
          format: sarif
          output: trivy-server.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy reports to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: |
            trivy-client.sarif
            trivy-server.sarif
